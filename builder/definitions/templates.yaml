# HTML Export Templates
templates:
  - name: "Preview Folder"
    path: "/Templates/Preview Folder"
    badge: "display-chart"
    content: |
      !3 ^value($Name)^
      
      ^children()^
      
  - name: "Preview Story"  
    path: "/Templates/Preview Story"
    badge: "display-chart"
    content: |
      !4 ^value($Name)^
      
      As ^value($StoryRole)^
      I want to ^value($StoryWant)^
      So that ^value($StoryReason)^
      
      **Group:** ^value($Group)^
      **Status:** ^if($StoryReady=="true")^✅ Ready^else^⏳ In Progress^endif^
      ^if($HasIssues=="true")^⚠️ **Has Issues**^endif^
      
      ^if($RetinaURL!="")^[RETINA Story|^value($RetinaURL)^]^endif^
      ^if($InterfaceDiagramURL!="")^[Interface Diagram|^value($InterfaceDiagramURL)^]^endif^
      
  - name: "Preview Leaf"
    path: "/Templates/Preview Leaf"
    badge: "display-chart"
    content: |
      !4 ^value($Name)^
      
      ^value($Text)^